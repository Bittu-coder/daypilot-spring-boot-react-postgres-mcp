services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daypilot
      POSTGRES_USER: daypilot
      POSTGRES_PASSWORD: daypilot
    ports:
      - "5432:5432"
    volumes:
      - daypilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daypilot -d daypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/daypilot
      SPRING_DATASOURCE_USERNAME: daypilot
      SPRING_DATASOURCE_PASSWORD: daypilot
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  daypilot_pgdata:
